<!doctype html>
<html lang="en" data-skin="abendrot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mind.</title>
<meta name="description" content="mind. is a place to thread your thoughts onto a string, name every knot, and watch them connect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-label="mind.">mind<b>.</b></div>
    <button class="nav-btn" data-view="string" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c4-8 6-8 10 0s6 8 10 0"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg><span>String</span></button>
    <button class="nav-btn" data-view="sky"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><circle cx="19" cy="18" r="1.4"/><circle cx="5.5" cy="18.5" r="1"/></svg><span>Sky</span></button>
    <button class="nav-btn" data-view="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg><span>Notes</span></button>
    <button class="nav-btn" data-view="web"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="17" r="2.4"/><path d="M7.7 8.2l3 6.9M16.6 7.6l-3.3 7.6M8 7h8"/></svg><span>Web</span></button>
    <button class="nav-btn" data-view="books"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg><span>Books</span></button>
    <div class="sp"></div>
    <div class="chordnow" data-chord hidden title="The chord the band is on"></div>
    <div class="streak" id="streak" hidden><b>0</b><span>day streak</span></div>
    <div class="clock" id="clock"><b>--:--</b>Wien</div>
    <button class="nav-btn" id="cafeBtn" aria-label="Café mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.2 2.2 0 0 1 0 4.4H16M8.5 3.5c-.8 1 .8 1.6 0 2.7M12 3.5c-.8 1 .8 1.6 0 2.7"/></svg><span>Café mode</span></button>
    <button class="nav-btn" id="focusBtn" aria-label="Focus mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Focus</span></button>
    <button class="nav-btn" id="openSettings" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
  </nav>

  <div class="main">
    <header class="top">
      <div><div class="eyebrow" id="eyebrow"></div><h1 class="h1" id="h1"></h1></div>
      <div class="top-right">
        <span class="badge warn" id="storeWarn" hidden title="Your browser blocks storage. Save a backup from Settings to keep your thoughts.">Not saving</span>
        <span class="badge" id="sampleBadge" hidden>Sample</span>
        <span class="badge cafe-badge" id="cafeBadge" hidden>Café mode <button class="linkish" id="cafeHide" type="button">Hide</button></span>
        <button class="btn bookchip" id="bookChip" type="button" aria-label="Open brain books"></button>
        <button class="btn" id="palBtn" type="button" aria-label="Search and commands"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="hide-s">Search</span><kbd>Ctrl K</kbd></button>
        <button class="btn keysbtn" id="keysBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-pressed="false"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v7M12 6v7M16 6v7M6.5 13h3M10.5 13h3M14.5 13h3"/></svg>Keys</button>
      </div>
    </header>
    <div class="keys-pop" id="keysPop" hidden role="dialog" aria-label="Jazz keys"></div>

    <div class="views">
      <section class="view" id="view-string" aria-label="String editor">
        <div class="stage-head">
          <div class="cat-row" id="catRow" role="group" aria-label="Category of the next knot"></div>
          <div class="mono" id="strStats"></div>
        </div>
        <div class="banner" id="sampleBanner" hidden>
          <span>This is a sample book with example thoughts. Write into it or start your own.</span>
          <button class="btn small primary" id="bannerNew" type="button">Start my own book</button>
          <button class="btn small icon-btn ghost" id="bannerX" type="button" aria-label="Dismiss"></button>
        </div>
        <div class="canvas-wrap" id="strWrap">
          <canvas id="strCanvas" role="application" aria-label="String of thoughts. Type to write along the string. Enter ties a knot."></canvas>
          <textarea class="ghost-input" id="strInput" aria-label="Write a thought" autocomplete="off" autocapitalize="sentences" spellcheck="true" rows="1"></textarea>
          <div class="tray" id="tray" hidden></div>
          <div class="pop" id="knotPop" hidden></div>
        </div>
        <div class="stage-foot">
          <div class="hint" id="strHint"></div>
          <div class="piano-mini" id="pianoMini" hidden></div>
          <div class="foot-actions">
            <button class="btn" id="btnRandom" type="button" title="Jump to a random older knot">Resurface</button>
            <button class="btn" id="btnClear" type="button">Clear</button>
            <button class="btn primary" id="btnKnot" type="button">Tie a knot</button>
          </div>
        </div>
      </section>

      <section class="view" id="view-sky" aria-label="Sky: write in the stars" hidden>
        <div class="canvas-wrap sky-wrap" id="skyWrap">
          <canvas id="skyCanvas" role="application" aria-label="Night sky. Type to turn words into stars. Enter ties the constellation."></canvas>
          <textarea class="ghost-input" id="skyInput" aria-label="Write a thought among the stars" autocomplete="off" spellcheck="true" rows="1"></textarea>
          <div class="pop sky-card" id="skyCard" hidden></div>
        </div>
        <div class="stage-foot">
          <div class="hint" id="skyHint"></div>
          <div class="foot-actions">
            <button class="btn" id="skyFit" type="button">Zoom out</button>
            <button class="btn" id="skyClear" type="button">Clear</button>
            <button class="btn primary" id="skyKnot" type="button">Tie a constellation</button>
          </div>
        </div>
      </section>

      <section class="view" id="view-notes" aria-label="Notes" hidden>
        <div class="notes">
          <aside class="side" id="noteSide" aria-label="Categories"></aside>
          <div class="notes-main">
            <div class="notes-bar">
              <input class="field search" id="noteSearch" type="search" placeholder="Search names and thoughts" aria-label="Search thoughts" autocomplete="off">
              <div class="seg" id="noteSort" role="radiogroup" aria-label="Sort"></div>
              <div class="seg" id="noteMode" role="radiogroup" aria-label="Layout"></div>
            </div>
            <div class="notes-body" id="noteBody"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-web" aria-label="Web of thoughts" hidden>
        <div class="webwrap" id="webWrap">
          <canvas id="webCanvas" aria-label="Web of linked knots, labelled by name. Drag to move, scroll to zoom, select a knot to explore."></canvas>
          <div class="web-ui">
            <div class="web-tl">
              <div class="seg" id="webLayout" role="radiogroup" aria-label="Web layout"></div>
              <div class="mono" id="webStats"></div>
            </div>
            <div class="web-tr">
              <input class="field" id="webSearch" type="search" placeholder="Find a knot" aria-label="Find a knot" autocomplete="off">
              <button class="btn icon-btn" id="zoomIn" type="button" aria-label="Zoom in"></button>
              <button class="btn icon-btn" id="zoomOut" type="button" aria-label="Zoom out"></button>
              <button class="btn icon-btn" id="zoomFit" type="button" aria-label="Fit to screen"></button>
            </div>
            <div class="link-banner" id="linkBanner" hidden></div>
            <div class="detail" id="webDetail" hidden></div>
            <div class="web-bl" id="webLegend"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-books" aria-label="Brain books" hidden>
        <div class="books" id="booksBody"></div>
      </section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Settings" aria-modal="true">
  <div class="drawer-head"><h2>Settings</h2><button class="btn icon-btn ghost" id="closeSettings" type="button" aria-label="Close settings"></button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="modal" id="modal"><div class="back" id="modalBack"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="lock" id="lock" hidden tabindex="-1" role="dialog" aria-label="Screen hidden">
  <div class="lock-in"><div class="lock-logo">mind<b>.</b></div><p id="lockMsg">Hidden. Click or press any key to come back.</p>
    <div class="lock-row" id="lockRow" hidden><input class="field" id="lockPin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" placeholder="PIN"><button class="btn primary" id="lockGo" type="button">Open</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="jazz.js"></script>
<script src="app.js"></script>
</body>
</html>
